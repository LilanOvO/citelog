<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="560" viewBox="0 0 1440 560" role="img" aria-labelledby="title desc">
<title id="title">Install CiteLog in three steps</title><desc id="desc">Download and unzip citelog-chrome.zip. Open chrome://extensions, enable developer mode, choose Load unpacked and select the extracted folder with manifest.json. Pin CiteLog and bind your public Google Scholar profile.</desc>
<defs><style>text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif;fill:#203953}.muted{fill:#61798f}.blue{fill:#377ab9}.title{font-size:28px;font-weight:600}.body{font-size:21px}.small{font-size:17px}.mono{font-family:ui-monospace,SFMono-Regular,monospace;font-size:16px}</style></defs>
<rect width="1440" height="560" rx="22" fill="#f4f8fd"/>
<text x="42" y="60" font-size="32" font-weight="600">From ZIP to toolbar.</text><text x="42" y="96" class="body muted">三步安装 · No terminal. No build step.</text>
<g transform="translate(40 128)"><rect width="432" height="342" rx="18" fill="#fff" stroke="#dbe7f3"/>
<circle cx="38" cy="42" r="20" fill="#eaf4fe"/><text x="32" y="49" class="body blue">1</text><text x="70" y="50" class="title">Download &amp; unzip</text><text x="26" y="92" class="body muted">下载并解压，保留文件夹</text>
<rect x="26" y="126" width="380" height="174" rx="12" fill="#f5f9fe"/><path d="M48 153h27l8 9h35v23H48z" fill="#a4d1fa"/>
<text x="136" y="178" class="body">citelog-chrome/</text><path d="M65 205v61m0-49h20m-20 40h20" fill="none" stroke="#b8cfe4" stroke-width="2"/>
<text x="98" y="223" class="mono">manifest.json</text><text x="98" y="263" class="mono muted">popup.html · icons/ · …</text></g>
<g transform="translate(504 128)"><rect width="432" height="342" rx="18" fill="#fff" stroke="#dbe7f3"/>
<circle cx="38" cy="42" r="20" fill="#eaf4fe"/><text x="32" y="49" class="body blue">2</text><text x="70" y="50" class="title">Load in Chrome</text><text x="26" y="92" class="body muted">开启开发者模式，加载文件夹</text>
<rect x="26" y="126" width="380" height="43" rx="10" fill="#f5f9fe"/><text x="43" y="154" class="mono">chrome://extensions</text>
<text x="30" y="206" class="small muted">Developer mode / 开发者模式</text><rect x="349" y="186" width="48" height="26" rx="13" fill="#377ab9"/><circle cx="384" cy="199" r="10" fill="white"/>
<rect x="26" y="238" width="380" height="53" rx="10" fill="#d9ecff"/><text x="68" y="271" class="body blue">Load unpacked / 加载已解压</text></g>
<g transform="translate(968 128)"><rect width="432" height="342" rx="18" fill="#fff" stroke="#dbe7f3"/>
<circle cx="38" cy="42" r="20" fill="#eaf4fe"/><text x="32" y="49" class="body blue">3</text><text x="70" y="50" class="title">Pin &amp; connect</text><text x="26" y="92" class="body muted">固定图标，绑定 Scholar 主页</text>
<text x="28" y="159" class="title">CiteLog</text><text x="28" y="195" class="small muted">Your public Google Scholar profile</text>
<rect x="26" y="211" width="380" height="40" rx="8" fill="#f5f9fe" stroke="#e1ebf4"/><text x="39" y="237" class="mono muted">scholar.google.com/citations?…</text>
<rect x="26" y="268" width="380" height="48" rx="10" fill="#d9ecff"/><text x="87" y="298" class="body blue">绑定主页 / Bind profile</text></g>
<text x="42" y="517" class="small muted">Select the folder containing manifest.json. Keep it in the same location. / 选择直接包含 manifest.json 的文件夹，安装后不要移动。</text>
<text x="42" y="543" font-size="14" class="muted">Illustrated installation guide · Local beta installation · Chrome 116+</text>
</svg>
